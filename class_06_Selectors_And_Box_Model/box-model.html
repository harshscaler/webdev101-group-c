<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            /* padding: 20px; */
            border: 10px solid black;

            border-width: 10px;
            /* margin: 20px; */
            /* margin-top: 20px;
            margin-right: 30px;
            margin-bottom: 40px;
            margin-left: 50px; */
            margin : 20px; /* top right bottom left */
            padding: 30px ;
            background-color: lightblue;
        }

        .content-box {
            box-sizing: content-box; /* Default value */
        }

        .border-box {
            box-sizing: border-box;
        }  

        p {
            background-color: black;
            color: white;
            display: inline;
        }

        span {
            background-color: yellow;
            color: black;
            display: block;
        }
    </style>
</head>
