<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        button {
            background-color: cadetblue;
            width: 150px;
            height: 50px;
            position: absolute;
            left: 50vw;
            top: 50vh;
            transition: background-color 3s cubic-bezier(0.03, 0.24, 0, 1.03);
            cursor: pointer;;
        }

        button:hover {
            background-color: red;
        }
    </style>
</head>
<body>
    <button>hover me</button>
</body>
</html>
