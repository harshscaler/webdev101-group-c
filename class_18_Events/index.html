<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <h1 class="heading">Events</h1>
    <h1 class="heading">Events2</h1>

    <button id="btn">Click Me</button>
    <button id="btn">Click Me 2</button>

    <script>
        const h1 = document.querySelector('.heading'); // element
        const btn = document.querySelectorAll('#btn'); // array

        // console.log(h1); 
        // console.log(btn); 
        // console.log(btn[1])

        function changeColor(element){
            element.style.color = 'red';
            element.style.backgroundColor = 'black';
        }

        btn.forEach(element => {
            element.addEventListener('click' , () => {
                changeColor(element);
            })
        });
    </script>
</body>
</html>
